<body class="antialiased min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0a0c0a]/60 backdrop-blur-2xl flex items-center justify-between px-margin-mobile h-16 border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.1)]">

<!-- Main Content -->
<main class="flex-grow pt-[88px] pb-[100px] px-margin-mobile flex flex-col gap-lg">
<!-- Photo Placeholder -->
<div class="w-full h-[180px] rounded-[24px] glass-panel flex flex-col items-center justify-center cursor-pointer hover:bg-white/5 transition-all active:scale-[0.98] duration-300 group overflow-hidden relative">

<span class="material-symbols-outlined text-[48px] text-[#A8DAB5] mb-3 opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all duration-300 drop-shadow-[0_0_12px_rgba(168,218,181,0.4)]" style="font-variation-settings: 'FILL' 0, 'wght' 200;">add_a_photo</span>
<p class="font-body-md text-body-md text-on-surface-variant tracking-wide group-hover:text-on-surface transition-colors">Toque para adicionar foto</p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-lg">
<!-- Nome do Produto -->
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant/80 ml-2 uppercase tracking-wider group-focus-within:text-primary transition-colors" for="product-name">Nome do Produto</label>
<input class="glass-input w-full rounded-[16px] px-5 py-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/40" id="product-name" placeholder="Ex: Leite Integral" type="text">
</div>
<!-- Quantidade & Unidade (Grid Layout) -->
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant/80 ml-2 uppercase tracking-wider group-focus-within:text-primary transition-colors" for="quantity">Quantidade</label>
<input class="glass-input w-full rounded-[16px] px-5 py-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/40 text-center" id="quantity" placeholder="0" type="number">
</div>
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant/80 ml-2 uppercase tracking-wider group-focus-within:text-primary transition-colors" for="unit">Unidade</label>
<div class="relative">
<select class="glass-input w-full rounded-[16px] px-5 py-4 font-body-lg text-body-lg text-on-surface appearance-none" id="unit">
<option value="un">Unidade (un)</option>
<option value="kg">Quilograma (kg)</option>
<option value="l">Litro (L)</option>
<option value="g">Grama (g)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Categoria -->
<div class="flex flex-col gap-xs mt-2">
<label class="font-label-sm text-label-sm text-on-surface-variant/80 ml-2 uppercase tracking-wider">Categoria</label>
<div class="flex flex-wrap gap-3 mt-1">
<button class="px-5 py-2.5 rounded-[12px] glass-panel bg-white/5 font-body-md text-body-md text-on-surface hover:bg-white/10 transition-colors border-white/10">Laticínios</button>

<button class="px-5 py-2.5 rounded-[12px] glass-panel bg-[#2E7D50]/20 font-body-md text-body-md text-[#A8DAB5] transition-all border-[#2E7D50]/50 neon-border-primary text-shadow-sm">Despensa</button>
<button class="px-5 py-2.5 rounded-[12px] glass-panel bg-white/5 font-body-md text-body-md text-on-surface hover:bg-white/10 transition-colors border-white/10">Limpeza</button>
<button class="px-4 py-2.5 rounded-[12px] glass-panel bg-white/5 font-body-md text-body-md text-on-surface flex items-center justify-center hover:bg-white/10 transition-colors border-white/10 border-dashed">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
</div>

<div class="glass-panel rounded-[24px] p-5 flex flex-col gap-5 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-50 pointer-events-none"></div>
<div class="flex justify-between items-center relative z-10">
<span class="font-title-md text-title-md text-on-surface tracking-wide">Novembro 2023</span>
<div class="flex gap-1 bg-black/20 rounded-full p-1 border border-white/5">

<button class="text-on-surface-variant hover:text-on-surface hover:bg-white/10 rounded-full transition-colors w-8 h-8 flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">chevron_right</span></button>
</div>
</div>
<div class="grid grid-cols-7 gap-1 text-center font-label-sm text-label-sm text-on-surface-variant/60 mb-1 relative z-10">
<div class="">D</div><div class="">S</div><div class="">T</div><div class="">Q</div><div class="">Q</div><div class="">S</div><div class="">S</div>
</div>

<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">4</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">5</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">6</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">7</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">8</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">9</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">10</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">11</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">12</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">13</div>
<div class="py-1.5 bg-gradient-to-br from-[#88d7a2] to-[#2E7D50] text-[#050705] rounded-full font-bold shadow-[0_0_15px_rgba(136,215,162,0.4)]">14</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">15</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">16</div>
<div class="py-1.5 text-on-surface/80 hover:bg-white/10 rounded-full cursor-pointer transition-colors">17</div>

<span class="material-symbols-outlined drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]" style="font-variation-settings: 'wght' 600;">check</span>
