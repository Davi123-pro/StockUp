<!-- Simple micro-interaction script for checkboxes -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.glass-card');
            
            cards.forEach(card => {
                const btn = card.querySelector('button');
                const icon = btn.querySelector('.material-symbols-outlined');
                
                // Only attach basic toggle logic to items in the pending section for demonstration
                if (card.parentElement.classList.contains('flex-col') && card.parentElement.parentElement.children[0] === card.parentElement) {
                    btn.addEventListener('click', () => {
                        const isChecked = icon.textContent === 'check_circle';
                        
                        if (!isChecked) {
                            // Check action
                            icon.textContent = 'check_circle';
                            icon.style.fontVariationSettings = "'wght' 400, 'FILL' 1";
                            btn.classList.remove('text-on-surface-variant/70', 'hover:text-primary-fixed');
                            btn.classList.add('text-primary-container', 'drop-shadow-[0_0_8px_rgba(46,125,80,0.5)]');
                            
                            const title = card.querySelector('.font-title-md');
                            title.classList.add('line-through', 'text-on-surface-variant/70');
                            title.classList.remove('text-on-surface', 'group-hover:text-white');
                            
                            card.classList.add('opacity-60', 'bg-white/[0.01]', 'border-white/[0.03]');
                            card.classList.remove('bg-white/[0.03]', 'border-white/[0.08]', 'hover:border-white/[0.15]', 'hover:bg-white/[0.05]');
                        } else {
                            // Uncheck action
                            icon.textContent = 'radio_button_unchecked';
                            icon.style.fontVariationSettings = "'wght' 300";
                            btn.classList.add('text-on-surface-variant/70', 'hover:text-primary-fixed');
                            btn.classList.remove('text-primary-container', 'drop-shadow-[0_0_8px_rgba(46,125,80,0.5)]');
                            
                            const title = card.querySelector('.font-title-md');
                            title.classList.remove('line-through', 'text-on-surface-variant/70');
                            title.classList.add('text-on-surface', 'group-hover:text-white');
                            
                            card.classList.remove('opacity-60', 'bg-white/[0.01]', 'border-white/[0.03]');
                            card.classList.add('bg-white/[0.03]', 'border-white/[0.08]', 'hover:border-white/[0.15]', 'hover:bg-white/[0.05]');
                        }
                    });
                }
            });
        });
    </script>
