<style>
        body {
            background-color: #121212;
            color: #e0e4dd;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-input {
            background-color: #1E1E1E;
            border: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s ease;
        }
        
        .glass-input:focus {
            outline: none;
            border-bottom: 2px solid #A8DAB5;
            box-shadow: none;
        }
        
        /* Custom Scrollbar for dark mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212; 
        }
        ::-webkit-scrollbar-thumb {
            background: #313632; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f4941; 
        }
    </style>

<body class="antialiased min-h-screen flex flex-col overflow-x-hidden" style="background-color: rgb(18, 18, 18); color: rgb(224, 228, 221);">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl flex items-center justify-between px-margin-mobile h-16 border-b border-white/5">
<button class="text-primary hover:bg-surface-variant/50 transition-colors p-2 rounded-full active:scale-95 duration-200 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="h-10 flex items-center justify-center"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4RCl27G9mi2Z-z-YqfNpdnB0uvea13ZYcwgZmmiXgj3rsdyoMMgphfYQPPK9xuQ-gUi7IyYx206bv76szce_sx2iubTEH0LK60ApxZdhd0tMJyALaaJlWeUaq9JKrTzdBipBZz6faWKx8zA0z2fAwONhxQ8E_L8E4ymeb7axtc0UeKBJfXpxyEvviYYDm9dyKNdiuB8V0PMXu-lZ-hhaCU0Bzojv1VT6qa4CwWDJpVt8fbaJ2SR5mrJG1iG0DPU7bqFjRyAkRBftR" alt="StockUp Logo" class="h-full w-auto object-contain"></div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-mobile flex flex-col gap-md">
<!-- Photo Placeholder -->
<div class="w-full h-[180px] rounded-[24px] glass-panel flex flex-col items-center justify-center cursor-pointer hover:bg-white/10 transition-colors active:scale-[0.98] duration-200">
<span class="material-symbols-outlined text-[48px] text-[#A8DAB5] mb-2" style="font-variation-settings: 'FILL' 0, 'wght' 300;">add_a_photo</span>
<p class="font-body-md text-body-md text-on-surface-variant">Toque para adicionar foto</p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-md mt-sm">
<!-- Nome do Produto -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="product-name">Nome do Produto</label>
<input class="glass-input w-full rounded-[12px] px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 bg-[#121212]" id="product-name" placeholder="Ex: Leite Integral" type="text">
</div>
<!-- Quantidade & Unidade (Grid Layout) -->
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="quantity">Quantidade</label>
<input class="glass-input w-full rounded-[12px] px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 bg-[#121212]" id="quantity" placeholder="0" type="number">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="unit">Unidade</label>
<select class="glass-input w-full rounded-[12px] px-4 py-3 font-body-lg text-body-lg text-on-surface appearance-none bg-[#1E1E1E]" id="unit" style="background-color: rgb(18, 18, 18);">
<option value="un">Unidade (un)</option>
<option value="kg">Quilograma (kg)</option>
<option value="l">Litro (L)</option>
<option value="g">Grama (g)</option>
</select>
</div>
</div>
<!-- Categoria -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Categoria</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-1.5 rounded-full border border-white/10 bg-white/5 font-body-md text-body-md text-on-surface hover:bg-white/10 transition-colors">Laticínios</button>
<button class="px-4 py-1.5 rounded-full border border-white/10 bg-white/5 font-body-md text-body-md text-on-surface hover:bg-white/10 transition-colors">Bebidas</button>
<button class="px-4 py-1.5 rounded-full border border-[#A8DAB5] bg-[#A8DAB5]/10 font-body-md text-body-md text-[#A8DAB5] transition-colors">Despensa</button>
<button class="px-4 py-1.5 rounded-full border border-white/10 bg-white/5 font-body-md text-body-md text-on-surface hover:bg-white/10 transition-colors">Limpeza</button>
<button class="px-3 py-1.5 rounded-full border border-white/10 bg-white/5 font-body-md text-body-md text-on-surface flex items-center justify-center hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
<!-- DatePicker Placeholder (Validade) -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Data de Validade</label>
<div class="glass-panel rounded-[16px] p-4 flex flex-col gap-4">
<div class="flex justify-between items-center">
<span class="font-title-md text-title-md text-on-surface">Novembro 2023</span>
<div class="flex gap-2">
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-1"><span class="material-symbols-outlined">chevron_left</span></button>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-1"><span class="material-symbols-outlined">chevron_right</span></button>
</div>
</div>
<div class="grid grid-cols-7 gap-1 text-center font-label-sm text-label-sm text-on-surface-variant mb-2">
<div class="">D</div><div class="">S</div><div class="">T</div><div class="">Q</div><div class="">Q</div><div class="">S</div><div class="">S</div>
</div>
<div class="grid grid-cols-7 gap-1 text-center font-body-md text-body-md">
<!-- Empty cells for offset -->
<div></div><div></div><div></div>
<!-- Days -->
<div class="py-1 text-on-surface-variant/50">1</div>
<div class="py-1 text-on-surface">2</div>
<div class="py-1 text-on-surface">3</div>
<div class="py-1 text-on-surface">4</div>
<div class="py-1 text-on-surface">5</div>
<div class="py-1 text-on-surface">6</div>
<div class="py-1 text-on-surface">7</div>
<div class="py-1 text-on-surface">8</div>
<div class="py-1 text-on-surface">9</div>
<div class="py-1 text-on-surface">10</div>
<div class="py-1 text-on-surface">11</div>
<div class="py-1 text-on-surface">12</div>
<div class="py-1 text-on-surface">13</div>
<div class="py-1 bg-[#A8DAB5] text-[#121212] rounded-full font-medium">14</div>
<div class="py-1 text-on-surface">15</div>
<div class="py-1 text-on-surface">16</div>
<div class="py-1 text-on-surface">17</div>
<div class="py-1 text-on-surface">18</div>
<!-- Truncated for brevity, normally you'd generate the full month -->
</div>
</div>
</div>
</div>
</main>
<!-- Footer Action -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-md border-t border-white/5 z-40">
<button class="w-full bg-[#2E7D50] text-white font-title-md text-title-md font-bold py-4 rounded-[16px] flex items-center justify-center gap-2 hover:bg-[#2E7D50]/90 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">check</span>
            SALVAR PRODUTO
        </button>
</div>




</body></html>
