<script>
        // Simple interaction script to toggle checkbox classes for visual effect
        document.querySelectorAll('.custom-checkbox-wrapper').forEach(wrapper => {
            const input = wrapper.querySelector('input[type="checkbox"]');
            
            // Initial state check
            if(input.checked) {
                wrapper.classList.add('item-checked');
                wrapper.classList.add('opacity-60');
            }
            
            wrapper.addEventListener('click', (e) => {
                // Prevent double firing if clicking directly on input
                if(e.target === input) return;
                
                input.checked = !input.checked;
                
                if(input.checked) {
                    wrapper.classList.add('item-checked');
                    wrapper.classList.add('opacity-60');
                    // Add filled icon style
                    const icon = wrapper.querySelector('.check-icon');
                    icon.classList.remove('text-background');
                    icon.classList.add('text-on-primary');
                    const circle = wrapper.querySelector('.w-6');
                    circle.classList.add('bg-primary');
                } else {
                    wrapper.classList.remove('item-checked');
                    wrapper.classList.remove('opacity-60');
                    // Remove filled icon style
                    const icon = wrapper.querySelector('.check-icon');
                    icon.classList.add('text-background');
                    icon.classList.remove('text-on-primary');
                    const circle = wrapper.querySelector('.w-6');
                    circle.classList.remove('bg-primary');
                }
            });
        });
    </script>
