<style>
        body {
            background-color: #121212; /* Explicit fallback */
            color: #e0e4dd;
            overflow-x: hidden;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Animation keyframes */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 80, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(46, 125, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 80, 0); }
        }
        .btn-pulse {
            animation: pulse-glow 2s infinite;
        }
    </style>

<body class="bg-background min-h-screen flex flex-col relative font-body-md">
<!-- Ambient Background Effect -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-primary-container/10 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container/10 blur-[100px]"></div>
</div>
<!-- TopAppBar (Transactional - Suppressed active nav, preserved skip) -->

<div class="flex items-center gap-xs text-primary dark:text-primary active:scale-95 duration-200">

</div>
<button class="font-label-sm text-label-sm text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200">
            Skip

<!-- Hero Section -->
<div class="w-full max-w-md flex flex-col items-center text-center">

<!-- Typography -->
<div class="space-y-md mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight leading-tight">
                    Bem-vindo ao Futuro<br/>da sua <span class="text-primary">Despensa</span>
</h1>
<p class="font-body-md text-body-md md:font-body-lg md:text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                    Controle seu estoque de alimentos com inteligência e estilo Cyberpunk Clean.
                </p>
</div>
<!-- Progress Indicators (Bento Grid style pills) -->
<div class="flex gap-sm mb-xl">
<div class="w-8 h-1 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-4 h-1 rounded-full bg-surface-variant transition-all duration-300"></div>

<!-- Navigation Shell suppressed because this is an onboarding (transactional) screen -->
<script>
        // Simple entry animation
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('h1, p, .flex.gap-sm');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = `all 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${0.3 + (index * 0.1)}s`;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
