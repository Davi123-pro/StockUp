<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- Top Navigation (Contextual departure, hiding global nav shell, showing a back button) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 glass-panel border-b-0">
<button class="text-on-surface hover:bg-surface-variant/50 p-2 rounded-full transition-colors active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-title-md text-title-md text-primary font-bold tracking-tight">StockUp</div>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-grow pt-0 pb-24 flex flex-col">
<!-- Hero Section -->
<div class="relative w-full h-[250px] bg-surface-container-highest">
<img alt="Product Image" class="w-full h-full object-cover" data-alt="A high-quality, close-up photograph of a jar of organic tomato sauce resting on a dark, sleek kitchen counter. The lighting is dramatic and moody, emphasizing the rich red color of the sauce against the deep OLED black background. The style is premium and editorial, fitting a high-end pantry management app with a cyberpunk clean aesthetic. Crisp focus on the jar label, with a subtle glassmorphic blur in the distant background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJWTyF7SbN9modANS3-iD_z8FHtS5HnUzYswr5EDTfgSxY53RdDVIHvM5nhBromknm9GONPgEE7MBFd9zcsWdPl_QhG8EHlF0BtK5vR_qjtb9ZCm7ac_Esa_Kn3lQIlQfUY9zKZJMOFeBwN1HrkClde7cPsaVTnjG9AIfQpTWUdMmfFSan73t4ucwl8dpDDZPKVNBm_yQVh5dkU1SAuXf3-WsUYiL5VcOT5bVRO2T1d0TN5TGazlBypxyrrw0mSttrZOfPRquINI9v">
<!-- Gradient Fade into Background -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent"></div>
<!-- Glass Chip Category -->
<div class="absolute top-20 left-margin-mobile glass-panel px-sm py-1 rounded-full font-label-sm text-label-sm text-on-surface">
                Despensa
            </div>
</div>
<!-- Content Area -->
<div class="px-margin-mobile -mt-xl relative z-10 flex flex-col gap-xl">
<!-- Header Info -->
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface m-0 leading-tight">Molho de Tomate Orgânico</h1>
</div>
<div class="flex items-center gap-xs">
<span class="bg-[#FFB74D]/20 text-[#FFB74D] px-sm py-1 rounded-full font-label-sm text-label-sm border border-[#FFB74D]/30 inline-flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="warning">warning</span>
                        Vence em 3 dias
                    </span>
<span class="text-on-surface-variant font-body-md text-body-md">500g</span>
</div>
</div>
<!-- Info Card -->
<div class="bg-surface rounded-xl p-md border border-white/5 relative overflow-hidden">
<!-- Semantic Status Strip -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-[#FFB74D]"></div>
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider mb-1">Data de Vencimento</span>
<span class="text-on-surface font-title-md text-title-md">20/12/2026</span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[32px]" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<!-- Stock Counter -->
<div class="flex flex-col gap-md">
<h2 class="font-title-md text-title-md text-on-surface">No estoque</h2>
<div class="flex items-center justify-center gap-xl py-lg bg-surface-container-low rounded-xl border border-white/5">
<button class="glass-panel w-12 h-12 rounded-full flex items-center justify-center text-on-surface hover:bg-white/10 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<div class="flex flex-col items-center justify-center w-20">
<span class="font-display-lg text-display-lg text-primary leading-none">2</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">unidades</span>
</div>
<button class="bg-primary-container text-on-primary-container w-12 h-12 rounded-full flex items-center justify-center hover:bg-primary-container/90 active:scale-95 transition-all shadow-lg shadow-primary-container/20 border border-primary/20">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
<!-- Progress Bar indicator of stock health -->
<div class="w-full bg-surface-container-highest rounded-full h-1 mt-2 overflow-hidden">
<div class="bg-primary h-1 rounded-full" style="width: 40%"></div>
</div>
</div>
<!-- Details / Notes section -->
<div class="flex flex-col gap-xs mt-2">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Anotações</h3>
<p class="text-body-md font-body-md text-on-surface bg-surface-container-low p-md rounded-lg border border-white/5">
                    Comprado no mercado local. Ideal para massas e pizzas. Manter refrigerado após aberto.
                </p>
</div>
</div>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 w-full bg-background/90 backdrop-blur-xl border-t border-white/5 p-margin-mobile z-40 pb-8">
<button class="w-full flex items-center justify-center gap-xs py-md rounded-lg border border-[#FF6B6B]/30 text-[#FF6B6B] hover:bg-[#FF6B6B]/10 active:scale-95 transition-all font-body-lg text-body-lg font-medium">
<span class="material-symbols-outlined text-[20px]" data-icon="delete">delete</span>
            Excluir Produto
        </button>
</footer>
</body></html>
