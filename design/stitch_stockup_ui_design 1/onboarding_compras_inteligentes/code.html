<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StockUp - Compras Inteligentes</title>

<style>
        .glass-panel {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glowing-icon {
            filter: drop-shadow(0 0 12px rgba(136, 215, 162, 0.6));
        }
        
        @keyframes floatItem1 {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translateY(-40px) translateX(20px); opacity: 1; }
            100% { transform: translateY(-50px) translateX(25px); opacity: 0; }
        }
        @keyframes floatItem2 {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translateY(-60px) translateX(-15px); opacity: 1; }
            100% { transform: translateY(-70px) translateX(-20px); opacity: 0; }
        }
        @keyframes floatItem3 {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translateY(-30px) translateX(30px); opacity: 1; }
            100% { transform: translateY(-40px) translateX(35px); opacity: 0; }
        }

        .anim-item-1 { animation: floatItem1 3s ease-in-out infinite; }
        .anim-item-2 { animation: floatItem2 3.5s ease-in-out infinite 0.5s; }
        .anim-item-3 { animation: floatItem3 4s ease-in-out infinite 1s; }
        
        .pulse-border {
            animation: pulseBorder 2s infinite;
        }
        @keyframes pulseBorder {
            0% { border-color: rgba(136, 215, 162, 0.2); box-shadow: 0 0 0 0 rgba(136, 215, 162, 0.1); }
            50% { border-color: rgba(136, 215, 162, 0.6); box-shadow: 0 0 15px 0 rgba(136, 215, 162, 0.3); }
            100% { border-color: rgba(136, 215, 162, 0.2); box-shadow: 0 0 0 0 rgba(136, 215, 162, 0.1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl dark:bg-surface/80 border-b border-white/5">
<div class="flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary dark:text-primary font-title-md text-title-md" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-display-lg text-display-lg font-bold text-primary tracking-tighter">StockUp</span>
</div>
<button class="text-on-surface-variant font-label-sm text-label-sm hover:opacity-80 transition-opacity active:scale-95 duration-200 uppercase tracking-widest">
                Skip
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-20 pb-32 px-margin-mobile relative z-10 w-full max-w-md mx-auto">
<!-- Interactive Graphic Area -->
<div class="relative w-full aspect-square max-w-[320px] mb-lg flex items-center justify-center">
<!-- Abstract background glow -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full blur-3xl scale-75"></div>
<!-- Central Shopping Cart -->
<div class="relative z-20 glass-panel rounded-full w-40 h-40 flex items-center justify-center pulse-border">
<span class="material-symbols-outlined text-primary text-6xl glowing-icon" style="font-variation-settings: 'FILL' 1;">shopping_cart_checkout</span>
</div>
<!-- Transforming Items -->
<div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center">
<!-- Item 1 -->
<div class="anim-item-1 absolute glass-panel px-sm py-xs rounded-lg flex items-center gap-xs shadow-lg shadow-black/50 border border-primary/30">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-on-surface">Leite</span>
</div>
<!-- Item 2 -->
<div class="anim-item-2 absolute glass-panel px-sm py-xs rounded-lg flex items-center gap-xs shadow-lg shadow-black/50 border border-primary/30 ml-20 mt-10">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-on-surface">Ovos</span>
</div>
<!-- Item 3 -->
<div class="anim-item-3 absolute glass-panel px-sm py-xs rounded-lg flex items-center gap-xs shadow-lg shadow-black/50 border border-primary/30 -ml-24 mt-4">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-on-surface">Pão</span>
</div>
</div>
<!-- Decorative List Lines behind -->
<div class="absolute w-3/4 h-3/4 border-2 border-dashed border-outline-variant/30 rounded-xl -z-10 animate-[spin_60s_linear_infinite]"></div>
</div>
<!-- Typography Context -->
<div class="text-center w-full mt-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">
                Compras Inteligentes
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Crie listas e, ao finalizar, adicione tudo ao seu estoque com apenas um clique.
            </p>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full z-50 bg-gradient-to-t from-background via-background/90 to-transparent pt-xl pb-margin-mobile px-margin-mobile">
<div class="max-w-md mx-auto flex flex-col gap-lg">
<!-- Progress Indicators -->
<div class="flex justify-center items-center gap-xs w-full">
<span class="material-symbols-outlined flex items-center justify-center text-outline-variant opacity-40 text-xs" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
<span class="material-symbols-outlined flex items-center justify-center text-outline-variant opacity-40 text-xs" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
<span class="material-symbols-outlined flex items-center justify-center text-primary scale-125 text-xs glowing-icon" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
<span class="material-symbols-outlined flex items-center justify-center text-outline-variant opacity-40 text-xs" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm py-4 rounded-xl flex items-center justify-center gap-sm active:scale-95 transition-transform shadow-lg shadow-primary-container/20 border border-primary/20">
                Próximo
                <span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</div>
</body></html>
